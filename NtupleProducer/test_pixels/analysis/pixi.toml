[workspace]
name = "l1pixels-analysis"
description = "L1 pixel b-tag pilot: analysis outside CMSSW (lists, taggers, rates, kappa_lambda, page plots). CMSSW only for ntuple production and FWLite scans."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# pinned to the ana-venv versions the published numbers were made with (BDT results depend on scikit-learn)
python = "3.10.*"
numpy = "2.0.2.*"
awkward = "2.8.12.*"
uproot = "5.6.9.*"
vector = "1.7.0.*"
scikit-learn = "1.6.1.*"
scipy = "1.13.1.*"
matplotlib-base = "3.9.4.*"
